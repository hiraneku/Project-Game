<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silence of Life — Idle Preview</title><style>:root{--ink:#eeeaf2;--muted:#a9a3b4;--accent:#ff654b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090a12;color:#241f2a;font-family:system-ui,sans-serif;display:block;overflow-x:hidden;overflow-y:scroll;padding:28px 0 48px}.wrap{width:min(1100px,94vw);margin:0 auto;display:grid;grid-template-columns:1fr 1.2fr;gap:7vw;align-items:center}.copy{animation:rise .8s ease both}.eyebrow{color:var(--accent);letter-spacing:.22em;text-transform:uppercase;font-size:11px;font-weight:700}.copy h1{font-family:Georgia,serif;font-size:clamp(42px,6vw,76px);font-weight:400;line-height:.95;margin:16px 0}.copy p{max-width:390px;color:var(--muted);line-height:1.7}.hint{margin-top:32px;color:#777384;font-size:12px}.stage{height:min(78vh,650px);min-height:480px;border:1px solid #272635;border-radius:18px;background:radial-gradient(circle at 50% 35%,#ffffff,#f5f1f2 68%,#e7dfe3);position:relative;overflow:hidden;display:grid;place-items:end center;box-shadow:0 24px 80px #0008}.stars{position:absolute;inset:0;background-image:radial-gradient(#aaa6bd 1px,transparent 1px);background-size:91px 77px;opacity:.22}.moon{position:absolute;width:140px;height:140px;border-radius:50%;background:#e8dfdc;top:11%;right:13%;box-shadow:0 0 50px #eee6db55}.ground{position:absolute;width:72%;height:8px;bottom:11%;border-radius:50%;background:#05050a;box-shadow:0 0 30px 12px #05050a}.character{position:absolute;bottom:12%;height:65%;max-height:440px;width:auto;image-rendering:auto;filter:drop-shadow(0 16px 8px #0009);transform-origin:bottom center;animation:breathe 1.8s ease-in-out infinite}.glow{position:absolute;bottom:11%;width:150px;height:28px;background:#ff654b22;border-radius:50%;filter:blur(12px);animation:glow 1.8s ease-in-out infinite}.badge{position:absolute;bottom:24px;left:24px;font-size:11px;color:#aaa5b5;letter-spacing:.08em}.dot{display:inline-block;width:7px;height:7px;background:#69d6a0;border-radius:50%;margin-right:8px;box-shadow:0 0 10px #69d6a0}@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-11px) scale(1.012,1.018)}}@keyframes glow{0%,100%{transform:scaleX(1);opacity:.65}50%{transform:scaleX(.88);opacity:.35}}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(max-width:720px){.wrap{grid-template-columns:1fr;gap:18px}.copy{padding-top:25px}.copy h1{font-size:48px;margin:10px 0}.hint{margin-top:14px}.stage{min-height:430px;height:58vh}.sprite-character{transform:scale(.25);animation:mobile-body-breathe 1.8s ease-in-out infinite;bottom:9%}@keyframes mobile-body-breathe{0%,100%{transform:translateY(0) scale(.25)}50%{transform:translateY(-5px) scale(.25)}}.moon{width:90px;height:90px}}.sprite-character{position:absolute;bottom:12%;left:50%;margin-left:-255px;width:510px;height:950px;transform-origin:bottom center;transform:scale(.40);animation:body-breathe 1.8s ease-in-out infinite;z-index:2}.part{position:absolute;width:auto}.head{width:510px;left:0;top:0;animation:head-breathe 1.8s ease-in-out infinite}.torso{width:420px;left:45px;top:350px;animation:torso-breathe 1.8s ease-in-out infinite}.legs{width:370px;left:70px;top:640px}@keyframes body-breathe{0%,100%{transform:translateY(0) scale(.40)}50%{transform:translateY(-6px) scale(.40)}}@keyframes head-breathe{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(4px,-10px) rotate(-1.2deg)}}@keyframes torso-breathe{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-2px) scaleY(1.015)}}
.sheet-character{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);width:min(42%,250px);aspect-ratio:212/624;background:url('idle-spritesheet.png') left center/800% 100% no-repeat;image-rendering:auto;filter:drop-shadow(0 16px 8px #0005);z-index:2;animation:idle-sheet 1.12s steps(8,end) infinite}@keyframes idle-sheet{to{background-position:100% center}}@media(max-width:720px){.sheet-character{width:34%;bottom:7%}}
