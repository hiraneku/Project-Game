<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silence of Life — Movement Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#090a12;color:#eeeaf2;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.game-shell{width:min(1000px,100%)}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}h1{font:400 clamp(28px,5vw,48px) Georgia,serif;margin:0}.eyebrow{color:#ff654b;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin-bottom:5px}.status{color:#aaa5b5;font-size:12px}canvas{display:block;width:100%;height:auto;border:1px solid #343142;border-radius:16px;background:#151522;image-rendering:auto;box-shadow:0 20px 60px #0008}.help{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;color:#aaa5b5;font-size:12px}.key{border:1px solid #3d394b;border-bottom-width:2px;border-radius:5px;padding:3px 7px;color:#eeeaf2}.mobile{display:none}@media(max-width:600px){body{padding:12px}.status{display:none}.help{font-size:11px}.mobile{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.mobile button{padding:15px 6px;border:1px solid #3d394b;border-radius:9px;background:#1b1a29;color:#eeeaf2;font-weight:700;touch-action:none}.mobile button:active,.mobile button.active{background:#ff654b;color:#090a12}}</style></head><body><main class="game-shell"><header><div><div class="eyebrow">Silence of Life · Prototype 02</div><h1>Movement Test</h1></div><div class="status" id="status">WALK · 0 km/h</div></header><canvas id="game" width="960" height="540"></canvas><div class="help"><span><b class="key">A</b> <b class="key">D</b> / <b class="key">←</b> <b class="key">→</b> bergerak</span><span><b class="key">Space</b> lompat</span><span><b class="key">Shift</b> toggle jalan/lari</span></div><div class="mobile"><button data-key="left">◀ KIRI</button><button data-key="jump">▲ LOMPAT</button><button data-key="right">KANAN ▶</button><button id="runButton">⚡ JALAN</button></div></main><script>const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');const keys=new Set();let run=false;const world={w:2400,ground:430};const p={x:150,y:350,w:34,h:80,vx:0,vy:0,onGround:false,face:1};const platforms=[{x:0,y:430,w:700,h:110},{x:800,y:430,w:600,h:110},{x:1500,y:430,w:900,h:110},{x:440,y:340,w:150,h:18},{x:950,y:320,w:180,h:18},{x:1260,y:365,w:120,h:18},{x:1660,y:330,w:180,h:18},{x:2050,y:275,w:170,h:18}];const stars=Array.from({length:70},(_,i)=>({x:(i*137)%world.w,y:35+(i*53)%260,r:i%3?1:2}));function down(k){keys.add(k)}function up(k){keys.delete(k)}addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Shift'].includes(e.key))e.preventDefault();if(e.key==='Shift'&&!e.repeat)run=!run;down(e.key)});addEventListener('keyup',e=>up(e.key));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);down(k)};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>{e.preventDefault();up(k)}});const runButton=document.querySelector('#runButton');runButton.onpointerdown=e=>{e.preventDefault();run=!run;runButton.textContent=run?'⚡ LARI':'⚡ JALAN';runButton.classList.toggle('active',run)};function input(k){return keys.has(k)||keys.has(k==='left'?'ArrowLeft':k==='right'?'ArrowRight':k)}function update(){const left=input('left')||keys.has('a')||keys.has('A'),right=input('right')||keys.has('d')||keys.has('D');const speed=run?5.8:3.2;if(left){p.vx=-speed;p.face=-1}else if(right){p.vx=speed;p.face=1}else p.vx*=.78;if((keys.has(' ')||keys.has('Spacebar')||keys.has('jump'))&&p.onGround){p.vy=-12;p.onGround=false;keys.delete(' ');keys.delete('jump')}p.vy+=.55;const oldBottom=p.y+p.h;p.x=Math.max(0,Math.min(world.w-p.w,p.x+p.vx));p.y+=p.vy;p.onGround=false;for(const q of platforms){if(p.x+p.w>q.x&&p.x<q.x+q.w&&oldBottom<=q.y&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.onGround=true}}if(p.y>600){p.x=150;p.y=300;p.vy=0}status.textContent=`${run?'RUN':'WALK'} · ${Math.round(Math.abs(p.vx)*10)/10} speed`}function draw(){const cam=Math.max(0,Math.min(world.w-canvas.width,p.x-canvas.width*.35));ctx.clearRect(0,0,canvas.width,canvas.height);const g=ctx.createLinearGradient(0,0,0,540);g.addColorStop(0,'#24223a');g.addColorStop(1,'#0d0e18');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#bdb5d0';stars.forEach(s=>{const x=s.x-cam*.25;if(x>-5&&x<canvas.width+5){ctx.globalAlpha=.35;ctx.beginPath();ctx.arc(x,s.y,s.r,0,7);ctx.fill()}});ctx.globalAlpha=1;ctx.fillStyle='#171724';ctx.beginPath();ctx.arc(760-cam*.08,125,62,0,7);ctx.fill();platforms.forEach(q=>{ctx.fillStyle='#252435';ctx.fillRect(q.x-cam,q.y,q.w,q.h);ctx.fillStyle='#5d566c';ctx.fillRect(q.x-cam,q.y,q.w,5)});const bob=p.onGround?Math.sin(performance.now()/140)*1.5:0;ctx.save();ctx.translate(p.x-cam+p.w/2,p.y+p.h/2+bob);const glow=ctx.createRadialGradient(-4,-5,2,0,0,18);glow.addColorStop(0,'#fff7a8');glow.addColorStop(.45,'#ffd83d');glow.addColorStop(1,'#e69b16');ctx.fillStyle=glow;ctx.shadowColor='#ffd83d88';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#60461a';ctx.beginPath();ctx.arc(-5,-3,2,0,Math.PI*2);ctx.arc(5,-3,2,0,Math.PI*2);ctx.fill();ctx.restore()}let lastFrame=0;function loop(now){if(now-lastFrame>=22){lastFrame=now;update();draw()}requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
